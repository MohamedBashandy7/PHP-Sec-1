<!doctype html>
<html lang="ar">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Infinity Code — PHP Fundamentals</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet" />
        <style>
            :root {
                --scale: 1;
                --bg: #0b0f19;
                --surface: #121a2c;
                --line: rgba(148, 163, 198, 0.14);
                --text: #e9edf6;
                --muted: #9aa7c2;
                --faint: #5f6c8a;
                --accent: #5b9bff;
                --accent-dim: rgba(91, 155, 255, 0.1);
                --violet: #b79cf6;
                --violet-dim: rgba(183, 156, 246, 0.08);
                --good: #4ed4a4;
                --gold: #e6c07a;
                --red: #e26a6a;
                --orange: #f0975c;
                --fs-hero: calc(54px * var(--scale));
                --fs-title: calc(36px * var(--scale));
                --fs-sub: calc(26px * var(--scale));
                --fs-body: calc(21px * var(--scale));
                --fs-ar: calc(20px * var(--scale));
                --fs-code: calc(18px * var(--scale));
                --fs-small: calc(16px * var(--scale));
                --fs-nav: calc(14px * var(--scale));
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                font-family: "Cairo", "Inter", sans-serif;
                background: var(--bg);
                color: var(--text);
                overflow: hidden;
                -webkit-font-smoothing: antialiased;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                background:
                    radial-gradient(
                        900px 520px at 88% -12%,
                        rgba(91, 155, 255, 0.06),
                        transparent 60%
                    ),
                    radial-gradient(
                        820px 620px at -12% 112%,
                        rgba(183, 156, 246, 0.05),
                        transparent 60%
                    );
            }
            ::selection {
                background: rgba(91, 155, 255, 0.3);
            }
            button {
                font-family: inherit;
            }
            button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            #prog {
                position: fixed;
                top: 0;
                left: 0;
                height: 3px;
                width: 0;
                background: var(--accent);
                z-index: 50;
                transition: width 0.45s ease;
                box-shadow: 0 0 12px rgba(91, 155, 255, 0.45);
            }
            #app {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                z-index: 1;
            }
            #topbar {
                height: 58px;
                flex: 0 0 58px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 22px;
                border-bottom: 1px solid var(--line);
                background: rgba(11, 15, 25, 0.72);
                backdrop-filter: blur(8px);
                position: relative;
                z-index: 20;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 11px;
            }
            .logo {
                width: 30px;
                height: 30px;
                border-radius: 9px;
                background: var(--accent-dim);
                border: 1px solid rgba(91, 155, 255, 0.35);
                display: grid;
                place-items: center;
                flex: 0 0 auto;
            }
            .logo svg {
                width: 18px;
                height: 18px;
                fill: var(--accent);
            }
            .brand-name {
                font-family: "Poppins", "Cairo";
                font-weight: 600;
                letter-spacing: 0.22em;
                font-size: 13.5px;
            }
            .brand-name b {
                color: var(--accent);
                font-weight: 700;
            }
            .brand-sub {
                font-family: "JetBrains Mono", "Cairo";
                font-size: 11px;
                color: var(--faint);
                letter-spacing: 0.08em;
                border-left: 1px solid var(--line);
                padding-left: 14px;
                margin-left: 4px;
            }
            .sect-chip {
                font-family: "Cairo";
                font-size: 12px;
                font-weight: 700;
                color: var(--violet);
                border: 1px dashed rgba(183, 156, 246, 0.4);
                padding: 3px 13px;
                border-radius: 999px;
                white-space: nowrap;
                direction: rtl;
            }
            .tb-right {
                display: flex;
                align-items: center;
                gap: 9px;
            }
            .counter {
                font-family: "JetBrains Mono";
                font-size: var(--fs-nav);
                color: var(--muted);
                letter-spacing: 0.1em;
                margin-right: 8px;
                min-width: 78px;
                text-align: center;
            }
            .ibtn {
                width: 34px;
                height: 34px;
                border-radius: 9px;
                border: 1px solid var(--line);
                background: rgba(148, 163, 198, 0.06);
                color: var(--muted);
                display: grid;
                place-items: center;
                cursor: pointer;
                transition: 0.2s;
            }
            .ibtn:hover {
                color: var(--accent);
                border-color: rgba(91, 155, 255, 0.4);
            }
            .ibtn svg {
                width: 16px;
                height: 16px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            #botbar {
                height: 42px;
                flex: 0 0 42px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 22px;
                border-top: 1px solid var(--line);
                color: var(--faint);
                position: relative;
                z-index: 20;
            }
            .f-left {
                font-family: "Poppins", "Cairo";
                letter-spacing: 0.1em;
                font-size: 11px;
            }
            .f-left b {
                color: var(--muted);
            }
            .f-hint {
                font-family: "Cairo";
                font-size: 11.5px;
                color: #4e5c7e;
            }
            .f-right {
                font-family: "Cairo";
                font-size: 11.5px;
                font-weight: 700;
                color: var(--violet);
            }
            .navbtn {
                position: fixed;
                top: 50%;
                transform: translateY(-50%);
                width: 46px;
                height: 46px;
                border-radius: 50%;
                border: 1px solid var(--line);
                background: rgba(17, 24, 40, 0.72);
                backdrop-filter: blur(6px);
                color: var(--muted);
                display: grid;
                place-items: center;
                cursor: pointer;
                z-index: 25;
                transition: 0.2s;
            }
            .navbtn:hover {
                color: var(--accent);
                border-color: rgba(91, 155, 255, 0.5);
            }
            .navbtn.prev {
                left: 16px;
            }
            .navbtn.next {
                right: 16px;
            }
            .navbtn svg {
                width: 20px;
                height: 20px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2.2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .navbtn[disabled] {
                opacity: 0.22;
                pointer-events: none;
            }
            #toast {
                position: fixed;
                bottom: 60px;
                left: 50%;
                transform: translate(-50%, 10px);
                opacity: 0;
                transition: 0.25s;
                background: #151d31;
                border: 1px solid var(--line);
                color: var(--muted);
                padding: 8px 18px;
                border-radius: 999px;
                font-family: "Cairo";
                font-size: 12.5px;
                z-index: 60;
                pointer-events: none;
            }
            #toast.show {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            #stage {
                flex: 1;
                position: relative;
                min-height: 0;
                z-index: 1;
                overflow: hidden;
            }
            .slide {
                position: absolute;
                inset: 0;
                margin: 0 auto;
                max-width: 1480px;
                padding: 26px 84px 18px;
                display: flex;
                flex-direction: column;
                overflow-y: auto;
                overflow-x: hidden;
                scrollbar-width: thin;
                scrollbar-color: #243049 transparent;
                opacity: 0;
                visibility: hidden;
                transform: translateX(56px);
                z-index: 1;
                transition:
                    opacity 0.38s ease,
                    transform 0.5s cubic-bezier(0.22, 0.7, 0.3, 1),
                    visibility 0s linear 0.5s;
            }
            .slide::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }
            .slide::-webkit-scrollbar-thumb {
                background: #243049;
                border-radius: 8px;
                border: 2px solid var(--bg);
            }
            .slide::-webkit-scrollbar-thumb:hover {
                background: #3b4d75;
            }
            .slide::-webkit-scrollbar-track {
                background: transparent;
            }
            .slide.pos-left {
                transform: translateX(-56px);
            }
            .slide.active {
                opacity: 1;
                visibility: visible;
                transform: none;
                z-index: 2;
                transition:
                    opacity 0.45s ease,
                    transform 0.55s cubic-bezier(0.22, 0.7, 0.3, 1),
                    visibility 0s;
            }
            .s-head {
                opacity: 0;
                transform: translateY(10px);
                flex: 0 0 auto;
            }
            .slide.active .s-head {
                opacity: 1;
                transform: none;
                transition:
                    opacity 0.5s ease,
                    transform 0.55s cubic-bezier(0.22, 0.7, 0.3, 1);
            }
            .s-body {
                flex: 1 1 auto;
                min-height: max-content;
                display: flex;
                flex-direction: column;
                margin-top: 16px;
            }
            .s-body > *,
            .col > *,
            .duo > * {
                opacity: 0;
                transform: translateY(14px);
            }
            .slide.active .s-body > *,
            .slide.active .col > *,
            .slide.active .duo > * {
                opacity: 1;
                transform: none;
                transition:
                    opacity 0.55s ease,
                    transform 0.6s cubic-bezier(0.22, 0.7, 0.3, 1);
                transition-delay: calc(var(--i, 0) * 70ms + 0.12s);
            }
            .slide:not(.active) :is(.s-body > *, .col > *, .duo > *) {
                transition: none;
            }

            .kicker {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
                flex-wrap: wrap;
            }
            .k-num {
                font-family: "JetBrains Mono";
                font-weight: 600;
                font-size: calc(var(--fs-nav) * 0.9);
                letter-spacing: 0.1em;
                color: var(--accent);
                background: var(--accent-dim);
                border: 1px solid rgba(91, 155, 255, 0.3);
                padding: 4px 14px;
                border-radius: 999px;
                white-space: nowrap;
            }
            .k-tag {
                font-family: "Cairo";
                font-weight: 700;
                font-size: calc(var(--fs-nav) * 0.92);
                color: var(--violet);
                border: 1px dashed rgba(183, 156, 246, 0.45);
                padding: 3px 13px;
                border-radius: 999px;
                white-space: nowrap;
                direction: rtl;
            }
            .k-status {
                font-family: "Cairo";
                font-weight: 800;
                font-size: calc(var(--fs-nav) * 0.92);
                padding: 3px 13px;
                border-radius: 999px;
                white-space: nowrap;
            }
            .k-status.bad {
                color: #ff8a80;
                border: 1px solid rgba(226, 106, 106, 0.5);
                background: rgba(226, 106, 106, 0.08);
            }
            .k-status.good {
                color: var(--good);
                border: 1px solid rgba(78, 212, 164, 0.5);
                background: rgba(78, 212, 164, 0.08);
            }
            .k-line {
                flex: 1;
                height: 1px;
                background: var(--line);
                opacity: 0.7;
                min-width: 40px;
            }
            .s-title {
                font-family: "Cairo", "Poppins";
                font-size: var(--fs-title);
                font-weight: 800;
                letter-spacing: -0.01em;
                line-height: 1.25;
                text-align: right;
                direction: rtl;
                unicode-bidi: plaintext;
            }
            .s-title .m {
                font-family: "JetBrains Mono", monospace;
                color: var(--accent);
                font-size: 0.82em;
                direction: ltr;
                unicode-bidi: isolate;
            }
            .s-title .v {
                font-family: "JetBrains Mono", monospace;
                color: var(--violet);
                font-size: 0.82em;
                direction: ltr;
                unicode-bidi: isolate;
            }

            .cols {
                display: grid;
                grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
                gap: 24px;
                flex: 1;
                min-height: 0;
                margin-top: 16px;
            }
            .col {
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 13px;
            }
            .duo {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 18px;
            }
            .trio {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 15px 19px;
                direction: rtl;
            }
            .dg-card {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .cap-row {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-top: 11px;
                flex-wrap: wrap;
            }
            .blk-label {
                font-family: "Cairo";
                font-weight: 800;
                font-size: 12.5px;
                letter-spacing: 0.06em;
                color: var(--faint);
                margin-bottom: 7px;
                display: flex;
                align-items: center;
                gap: 10px;
                flex: 0 0 auto;
                direction: rtl;
            }
            .blk-label::after {
                content: "";
                flex: 1;
                height: 1px;
                background: var(--line);
            }
            .blk-label.err {
                color: #efa1a1;
            }
            .blk-label.err::after {
                background: rgba(226, 106, 106, 0.3);
            }
            .blk-label.ok {
                color: var(--good);
            }
            .blk-label.ok::after {
                background: rgba(78, 212, 164, 0.3);
            }
            .blk-label.out {
                color: var(--gold);
            }
            .blk-label.out::after {
                background: rgba(230, 192, 122, 0.3);
            }
            .errslot {
                flex: 0 1 auto;
                min-height: 0;
                display: flex;
            }
            .errslot .term {
                flex: 1;
                min-height: 0;
            }
            .errslot .term-body {
                max-height: 150px;
            }

            .codebox {
                background: #0a0e17;
                border: 1px solid rgba(148, 163, 198, 0.18);
                border-radius: 14px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                min-height: 0;
                flex: 1;
                box-shadow: 0 22px 44px -22px rgba(0, 0, 0, 0.65);
            }
            .col > .codebox {
                flex: 1 1 auto;
            }
            .cb-bar {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 0 14px;
                background: rgba(148, 163, 198, 0.07);
                border-bottom: 1px solid rgba(148, 163, 198, 0.13);
                flex: 0 0 auto;
                min-height: 38px;
            }
            .cb-dots {
                display: flex;
                align-items: center;
                gap: 7px;
                flex: 0 0 auto;
            }
            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                opacity: 0.85;
            }
            .cb-tab {
                font-family: "JetBrains Mono", monospace;
                font-size: 11.5px;
                color: var(--text);
                background: #0a0e17;
                border: 1px solid rgba(148, 163, 198, 0.18);
                border-bottom: none;
                border-radius: 8px 8px 0 0;
                padding: 7px 15px 8px;
                position: relative;
                white-space: nowrap;
            }
            .cb-tab::before {
                content: "";
                position: absolute;
                inset: 0 0 auto 0;
                height: 2px;
                background: var(--accent);
                border-radius: 2px 2px 0 0;
            }
            .cb-close {
                color: var(--faint);
                font-family: "JetBrains Mono";
                font-size: 12px;
                margin-left: 2px;
            }
            .cb-lang {
                margin-left: auto;
                font-family: "JetBrains Mono";
                font-size: 10px;
                letter-spacing: 0.16em;
                color: var(--faint);
                border: 1px solid var(--line);
                padding: 2px 8px;
                border-radius: 5px;
            }
            .cb-copy {
                margin-left: 8px;
                background: transparent;
                border: none;
                cursor: pointer;
                color: var(--faint);
                display: flex;
                align-items: center;
                justify-content: center;
                transition: 0.2s;
                padding: 4px;
                border-radius: 4px;
            }
            .cb-copy:hover {
                color: var(--accent);
                background: rgba(148, 163, 198, 0.1);
            }
            .cb-copy svg {
                width: 14px;
                height: 14px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .cb-copy.copied {
                color: var(--good);
            }
            .code-scroll {
                flex: 1;
                min-height: 0;
                overflow: auto;
                padding: 12px 10px;
                scrollbar-width: thin;
                scrollbar-color: #243049 transparent;
            }
            .code-scroll::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }
            .code-scroll::-webkit-scrollbar-thumb {
                background: #243049;
                border-radius: 8px;
                border: 2px solid #0a0e17;
            }
            .code-scroll::-webkit-scrollbar-track {
                background: transparent;
            }
            pre {
                margin: 0;
            }
            pre code {
                font-family: "JetBrains Mono", monospace;
                font-size: var(--fs-code);
                line-height: 1.6;
                display: block;
                color: #d4ddec;
                direction: ltr;
                text-align: left;
            }
            .cl {
                white-space: pre;
                padding-right: 20px;
                min-height: 1.6em;
            }
            .cl::before {
                counter-increment: ln;
                content: counter(ln, decimal-leading-zero);
                display: inline-block;
                width: 3.4ch;
                margin-right: 18px;
                text-align: right;
                color: #39466a;
                user-select: none;
            }
            .cl.hl {
                background: rgba(91, 155, 255, 0.08);
                box-shadow: inset 3px 0 0 0 var(--accent);
            }
            .cl.hl-red {
                background: rgba(226, 106, 106, 0.08);
                box-shadow: inset 3px 0 0 0 var(--red);
            }
            .tk-com {
                color: #5c6c8f;
                font-style: italic;
            }
            .tk-str {
                color: #9ccf8f;
            }
            .tk-var {
                color: #e8a15d;
            }
            .tk-kw {
                color: #6fa8f5;
            }
            .tk-fn {
                color: #e3c56b;
            }
            .tk-num {
                color: #e890a0;
            }
            .tk-tag {
                color: #5ad4e6;
            }

            .browser {
                background: #0a0e17;
                border: 1px solid rgba(148, 163, 198, 0.18);
                border-radius: 12px;
                overflow: hidden;
                flex: 0 0 auto;
            }
            .br-bar {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 7px 12px;
                background: rgba(148, 163, 198, 0.07);
                border-bottom: 1px solid rgba(148, 163, 198, 0.12);
            }
            .br-url {
                font-family: "JetBrains Mono";
                font-size: 10.5px;
                color: var(--muted);
                background: rgba(148, 163, 198, 0.08);
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 2px 14px;
            }
            .br-body {
                background: #f4f6fa;
                padding: 14px 18px;
                min-height: 64px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 4px;
            }
            .br-line {
                font-family: "JetBrains Mono", monospace;
                font-size: calc(var(--fs-code) * 0.92);
                color: #1e2a3e;
                direction: ltr;
                text-align: left;
                white-space: pre-wrap;
                line-height: 1.6;
            }
            .br-line b {
                color: #0e1526;
            }

            .term {
                background: #05070d;
                border: 1px solid rgba(226, 106, 106, 0.35);
                border-radius: 14px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                min-height: 0;
                box-shadow: 0 22px 44px -22px rgba(0, 0, 0, 0.7);
            }
            .term-bar {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 8px 14px;
                background: rgba(226, 106, 106, 0.07);
                border-bottom: 1px solid rgba(226, 106, 106, 0.22);
                flex: 0 0 auto;
            }
            .term-title {
                font-family: "Cairo";
                font-weight: 800;
                font-size: 12px;
                letter-spacing: 0.04em;
                color: #efa1a1;
                margin-left: 8px;
            }
            .term-badge {
                margin-left: auto;
                font-family: "JetBrains Mono";
                font-size: 10px;
                letter-spacing: 0.16em;
                color: #ff8a80;
                border: 1px solid rgba(226, 106, 106, 0.5);
                padding: 2px 9px;
                border-radius: 5px;
                white-space: nowrap;
            }
            .term-body {
                padding: 12px 18px;
                font-family: "JetBrains Mono", monospace;
                font-size: calc(var(--fs-small) * 0.88);
                line-height: 1.8;
                color: #c9d2e4;
                direction: ltr;
                text-align: left;
                overflow: auto;
                white-space: pre-wrap;
                word-break: break-word;
                flex: 1;
                min-height: 0;
            }
            .t-red {
                color: #ff7b72;
                font-weight: 600;
            }
            .t-gold {
                color: var(--gold);
            }
            .t-path {
                color: #7e89a6;
            }

            p.ar {
                font-family: "Cairo", sans-serif;
                font-size: var(--fs-ar);
                line-height: 1.95;
                color: #dee6f4;
                text-align: right;
            }
            p.ar + p.ar {
                margin-top: 7px;
            }
            p.ar b {

                    fs -= 0.5
                }
                if (fs <= MIN) pre.style.fontSize = MIN + "px"
            }

                            const originalHTML = copyBtn.innerHTML
                            copyBtn.innerHTML =
                                '<svg viewBox="0 0 24 24" style="stroke: var(--good);"><polyline points="20 6 9 17 4 12"></polyline></svg>'
                            copyBtn.classList.add("copied")
                            toast("تم نسخ الكود بنجاح!")
                            setTimeout(() => {
                                copyBtn.innerHTML = originalHTML
                                copyBtn.classList.remove("copied")
                            }, 2000)
                        })
                        .catch((err) => {
                            console.error("Copy failed", err)
                        })
                }
            })

            window.addEventListener("keydown", (e) => {
                if (e.ctrlKey || e.metaKey || e.altKey) return
                switch (e.key) {
                    case "ArrowRight":
                    case "PageDown":
                    case " ":
                        e.preventDefault()
                        next()
                        break
                    case "ArrowLeft":
                    case "PageUp":
                    case "Backspace":
                        e.preventDefault()
                        prev()
                        break
                    case "Escape":
                        if (isFS())
                            (document.exitFullscreen || document.webkitExitFullscreen).call(
                                document
                            )
                        break
                    case "Home":
                        e.preventDefault()
                        go(0, -1)
                        break
                    case "End":
                        e.preventDefault()
                        go(TOTAL - 1, 1)
                        break
                    case "+":
                    case "=":
                        zoom(1)
                        break
                    case "-":
                    case "_":
                        zoom(-1)
                        break
                    case "0":
                        zoom(0)
                        break
                    case "f":
                    case "F":
                    case "ب":
                        e.preventDefault()
                        toggleFS()
                        break
                }
            })

            let tx = 0,
                ty = 0
            window.addEventListener(
                "touchstart",
                (e) => {
                    tx = e.touches[0].clientX
                    ty = e.touches[0].clientY
                },
                { passive: true }
            )
            window.addEventListener(
                "touchend",
                (e) => {
                    const dx = e.changedTouches[0].clientX - tx
                    const dy = e.changedTouches[0].clientY - ty
                    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? next() : prev()
                },
                { passive: true }
            )

            let rzTimer
            window.addEventListener("resize", () => {
                clearTimeout(rzTimer)
                rzTimer = setTimeout(() => fitSlide(slideEls[cur]), 150)
            })
            document.addEventListener("fullscreenchange", () =>
                setTimeout(() => fitSlide(slideEls[cur]), 120)
            )
            if (document.fonts && document.fonts.ready)
                document.fonts.ready.then(() => fitSlide(slideEls[cur]))

            const startFrom = Math.min(
                TOTAL,
                Math.max(1, parseInt((location.hash.match(/\d+/) || [1])[0], 10))
            )
            go(startFrom - 1, 1)
        </script>
    </body>
</html>
